<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1010" width="1280" height="1010" role="img" aria-labelledby="title desc">
  <title id="title">معمارية طبقة حماية Copilot لـ CeliaOS — أربع بوابات قراءة فقط قبل خادم MCP</title>
  <desc id="desc">GitHub Copilot يستدعي الأدوات المسموحة فقط عبر جسر يحمل قائمة سماح من أربع أدوات، ويوسم كل أداة بـ readOnlyHint، ويقيّد القدرات على tools، وينقّي النتائج. اثنتا عشرة أداة كتابة وأثر خارجي تُرفض قبل الخادم.</desc>
  <rect x="0" y="0" width="1280" height="1010" rx="0" fill="#f7f9fc" stroke="none" stroke-width="1.5"/>
  <text x="1240" y="56" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="29" font-weight="700" fill="#0f172a" text-anchor="end">معمارية طبقة حماية Copilot في CeliaOS</text><text x="1240" y="90" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="end">قراءة فقط بالتصميم · كل استدعاء يمر على أربع بوابات قبل خادم Celia MCP · لا مفاتيح ولا بطاقة في الإعداد</text><rect x="941.5072000000002" y="108" width="298.4927999999998" height="26" rx="13" fill="#dcfce7" stroke="none" stroke-width="1.5"/><text x="1228" y="125.32" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="12" font-weight="600" fill="#15803d" text-anchor="end">policy: copilot-read-only-allowlist v1</text><rect x="769.8336000000002" y="108" width="155.67360000000005" height="26" rx="13" fill="#e0e7ff" stroke="none" stroke-width="1.5"/><text x="913.5072000000002" y="125.32" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="12" font-weight="600" fill="#3730a3" text-anchor="end">٤ أدوات مسموحة من ١٦</text><rect x="561.8720000000001" y="108" width="191.96160000000006" height="26" rx="13" fill="#e0f2fe" stroke="none" stroke-width="1.5"/><text x="741.8336000000002" y="125.32" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="12" font-weight="600" fill="#0369a1" text-anchor="end">readOnlyHint · tools فقط</text><rect x="389.42080000000004" y="108" width="156.45120000000003" height="26" rx="13" fill="#f1f5f9" stroke="none" stroke-width="1.5"/><text x="533.8720000000001" y="125.32" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="end">لا مفاتيح · لا MySQL</text>
