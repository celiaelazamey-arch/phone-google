# Full single-service runtime. Explicit FREE plan; no paid disk, worker or expiring database.
# Create a NEW dedicated Aiven Free MySQL database first. Secrets go into Render only.
services:
  - type: web
    name: celia-phone-google
    runtime: docker
    dockerfilePath: ./Dockerfile.mcp
    plan: free
    healthCheckPath: /readyz
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3010'
      - key: CELIA_MCP_HOST
        value: 0.0.0.0
      - key: CELIA_MCP_PORT
        value: '3010'
      - key: CELIA_MCP_API_TOKEN
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: CELIA_MCP_DISABLE_MYSQL
        value: 'false'
      - key: CELIA_ENABLE_INTEGRATIONS
        value: 'true'
      - key: CELIA_DB_INITIALIZE
        value: empty-only
      - key: CELIA_DEPLOYMENT_ROOT
        value: 'true'
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_SSL
        value: 'true'
      - key: MYSQL_SSL_CA_BASE64
        sync: false
      - key: CELIA_AI_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_GATEWAY_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: AGENETROUTERAPI_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: CELIA_VOICE_ID
        sync: false
      - key: FIGMA_ACCESS_TOKEN
        sync: false
      - key: YOUR_CODATA_API_KEY
        sync: false
      - key: CELIA_DISABLE_OLLAMA
        value: 'true'
      # Retired services (DEC-030, docs/deployment-profile.json → serviceRetirements): credentials proven dead by the
      # service-reality audit; flip to 'false' only after the account works again and a [reality] run says so.
      - key: CELIA_DISABLE_AI_GATEWAY
        value: 'true'
      - key: CELIA_DISABLE_DEEPSEEK
        value: 'true'
      - key: CELIA_DISABLE_AGENTROUTER
        value: 'true'
      - key: CELIA_DISABLE_CLOUDFLARE_R2
        value: 'true'
      - key: WHATSAPP_AUTO_REPLY_ENABLED
        value: 'false'
