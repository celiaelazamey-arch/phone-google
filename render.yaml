# Full single-service runtime. Explicit FREE plan; no paid disk, worker or expiring database.
# Create a NEW dedicated Aiven Free MySQL database first. Secrets go into Render only.
services:
  - type: web
    name: celia-phone-google
    runtime: docker
    dockerfilePath: ./Dockerfile.mcp
    plan: free
    healthCheckPath: /readyz
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3010'
      - key: CELIA_MCP_HOST
        value: 0.0.0.0
      - key: CELIA_MCP_PORT
        value: '3010'
      - key: CELIA_MCP_API_TOKEN
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: CELIA_MCP_DISABLE_MYSQL
        value: 'false'
      - key: CELIA_ENABLE_INTEGRATIONS
        value: 'true'
      - key: CELIA_DB_INITIALIZE
        value: empty-only
      - key: CELIA_DEPLOYMENT_ROOT
        value: 'true'
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_SSL
        value: 'true'
      - key: MYSQL_SSL_CA_BASE64
        sync: false
      # The public URL of this service. Without it the OAuth callback and the links the assistant sends fall back
      # to localhost, so "اربط جوجل" would silently produce an unusable consent link. Paste the onrender.com URL
      # after the first deploy, then redeploy (Render cannot know its own URL at creation time).
      - key: APP_BASE_URL
        sync: false
      - key: CELIA_TIMEZONE
        value: Africa/Cairo
      # Google channel (GOOG-001/GOOG-002): the client is created in Google Cloud with exactly this redirect URI.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: CELIA_AI_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_GATEWAY_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: AGENETROUTERAPI_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: CELIA_VOICE_ID
        sync: false
      - key: FIGMA_ACCESS_TOKEN
        sync: false
      - key: YOUR_CODATA_API_KEY
        sync: false
      # WhatsApp Cloud API runtime credentials must be entered in Render's environment dashboard.
      # Repository Actions secrets are only available to workflows; they do not propagate to the runtime.
      - key: APP_OWNER_PHONE_E164
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_API_VERSION
        value: 'v26.0'
      - key: CELIA_DISABLE_OLLAMA
        value: 'true'
      # Retired services (DEC-030, docs/deployment-profile.json → serviceRetirements): credentials proven dead by the
      # service-reality audit; flip to 'false' only after the account works again and a [reality] run says so.
      - key: CELIA_DISABLE_AI_GATEWAY
        value: 'true'
      - key: CELIA_DISABLE_DEEPSEEK
        value: 'true'
      - key: CELIA_DISABLE_AGENTROUTER
        value: 'true'
      - key: CELIA_DISABLE_CLOUDFLARE_R2
        value: 'true'
      - key: WHATSAPP_AUTO_REPLY_ENABLED
        value: 'false'
