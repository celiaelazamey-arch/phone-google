name: Docs (build, artifact, optional Pages deploy)

on:
  push:
    branches: [main, arena/d42ad687-phone-google]
    paths:
      - 'docs/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Pages must be enabled once by the repo owner (Settings → Pages).
      # Until then, the site is still validated and published as a CI artifact.
      - id: configure
        uses: actions/configure-pages@v6
        continue-on-error: true
      - name: Validate the static site needs no external resources
        run: |
          test -f docs/site/index.html && test -f docs/site/demo.html
          if grep -EI 'src="https?://|href="https?://[^"]*\.css|@import.*https?://' docs/site/*.html; then
            echo "Static site must not depend on third-party runtime assets." && exit 1
          fi
          echo "Static site is self-contained."
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site
      - id: deployment
        if: steps.configure.outcome == 'success'
        uses: actions/deploy-pages@v5
