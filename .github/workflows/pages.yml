name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_without_config:
        description: 'Attempt artifact upload and deployment even if automatic Pages configuration fails'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site (dist)
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ (steps.configure.outcome == 'success' || github.event.inputs.deploy_without_config == 'true') && steps.upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Static shim tests
        run: node --test test/static-shim.test.js

      - name: Build static site
        run: node scripts/build-pages.mjs

      - name: Ensure no secrets leaked into dist
        run: |
          if grep -rEI "(MYSQL_PASSWORD|WHATSAPP_APP_SECRET|GOOGLE_CLIENT_SECRET|APP_API_TOKEN)=.+|AIza[0-9A-Za-z_-]{20,}" dist; then
            echo "::error::Secret-like value found in dist"
            exit 1
          fi
          echo "No secret-like values found in dist."

      # يفعّل مصدر Pages تلقائيًا إن كان مفعّلًا مسبقًا (أو ينجح كقراءة فقط).
      # التفعيل الأول لموقع Pages يحتاج صلاحية إدارية يملكها مالك المستودع فقط.
      - name: Configure Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Explain how to enable Pages (only if not enabled yet)
        if: steps.configure.outcome != 'success'
        env:
          REPO: ${{ github.repository }}
        run: |
          OWNER_SLUG="$(printf '%s' "${REPO%%/*}" | tr '[:upper:]' '[:lower:]')"
          REPO_NAME="${REPO##*/}"
          echo "::warning::GitHub Pages غير مفعّلة بعد — التفعيل الأول يحتاج نقرة من مالك المستودع."
          {
            echo "### ⚠️ GitHub Pages غير مفعّلة بعد"
            echo
            echo "نجح البناء والاختبارات، وملف الموقع جاهز كـ artifact، لكن GitHub يمنع تفعيل Pages بواسطة التوكن الآلي (يتطلب صلاحية المالك)."
            echo
            echo "**خطوة واحدة (مرة واحدة):** Settings → Pages → Build and deployment → Source: **GitHub Actions**، ثم Actions → Deploy (GitHub Pages) → Run workflow."
            echo
            echo "الرابط بعد التفعيل: https://${OWNER_SLUG}.github.io/${REPO_NAME}/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        id: upload
        if: steps.configure.outcome == 'success' || github.event.inputs.deploy_without_config == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
