name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional published tag (v0.2.0, etc.) to restore that exact verified site bundle. Empty = current main.'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write
  attestations: read
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Build or restore verified static site
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      pages_ready: ${{ steps.configure.outcome == 'success' && steps.upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build current source
        if: inputs.release_tag == ''
        run: npm run check && npm run release:check && npm run test:ci && npm run build:pages
      - name: Restore an existing, attested release (upgrade or rollback)
        if: inputs.release_tag != ''
        env:
          TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Invalid release tag.'
            exit 1
          fi
          COMMIT="$(git rev-parse "$TAG^{commit}")"
          git merge-base --is-ancestor "$COMMIT" origin/main
          mkdir -p .release-artifacts
          gh release download "$TAG" --dir .release-artifacts \
            --pattern 'celia-*-site.tar.gz' --pattern 'celia-*-source.tar.gz' \
            --pattern 'sbom.cdx.json' --pattern 'release.json' --pattern 'SHA256SUMS'
          npm run release:verify
          ARCHIVE=".release-artifacts/celia-$TAG-site.tar.gz"
          gh attestation verify "$ARCHIVE" --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/release.yml"
          gh attestation verify .release-artifacts/SHA256SUMS --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/release.yml"
          EXPECTED_COMMIT="$COMMIT" node --input-type=module -e '
            import fs from "node:fs";
            const r = JSON.parse(fs.readFileSync(".release-artifacts/release.json"));
            if (`v${r.version}` !== process.env.TAG || r.commit !== process.env.EXPECTED_COMMIT) process.exit(1);
          '
          mkdir -p dist
          ARCHIVE="$ARCHIVE" python3 - <<'PY'
          import os, pathlib, tarfile
          with tarfile.open(os.environ['ARCHIVE']) as archive:
              for member in archive.getmembers():
                  p = pathlib.PurePosixPath(member.name)
                  if p.is_absolute() or '..' in p.parts or not (member.isfile() or member.isdir()):
                      raise ValueError('Unsafe release archive')
              archive.extractall('dist', filter='data')
          PY
      - name: Ensure no obvious secret values leaked into dist
        run: |
          if grep -rEI '(MYSQL_PASSWORD|WHATSAPP_APP_SECRET|GOOGLE_CLIENT_SECRET|APP_API_TOKEN)=.+|AIza[0-9A-Za-z_-]{20,}' dist; then
            echo '::error::Secret-like value found in dist'
            exit 1
          fi
      - name: Configure Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: First-time Pages setup note
        if: steps.configure.outcome != 'success'
        run: echo '::warning::Enable Settings → Pages → Source → GitHub Actions once, then run this workflow again.'
      - name: Upload Pages artifact
        id: upload
        if: steps.configure.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    name: Deploy exact static artifact
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify live GitHub Pages deployment (10/10 routes HTTP 200 OK)
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module -e '
            const base = String(process.env.PAGE_URL || "https://celiaelazamey-arch.github.io/phone-google/").replace(/\/+$/, "");
            const routes = [
              "/",
              "/protocol.html",
              "/agent.html",
              "/kb.html",
              "/system.html",
              "/deploy.html",
              "/live.html",
              "/skills.html",
              "/api/protocol-benchmark.json",
              "/api/live.json"
            ];
            for (const route of routes) {
              const target = `${base}${route}`;
              let ok = false;
              let lastStatus = 0;
              for (let attempt = 1; attempt <= 12; attempt += 1) {
                try {
                  const res = await fetch(target, { headers: { "cache-control": "no-cache" } });
                  lastStatus = res.status;
                  if (res.status === 200) {
                    const text = await res.text();
                    if (route === "/api/protocol-benchmark.json") {
                      const parsed = JSON.parse(text);
                      if (parsed.totalCases === 20 && parsed.passedCount === 20 && parsed.decision === "GO") {
                        ok = true;
                        break;
                      }
                    } else if (text.length > 50) {
                      ok = true;
                      break;
                    }
                  }
                } catch {}
                await new Promise((r) => setTimeout(r, 3000));
              }
              if (!ok) {
                console.error(`::error title=Live Verification Failed::${target} returned ${lastStatus}`);
                process.exit(1);
              }
            }
            console.log(`::notice title=GitHub Pages Live Verified::10/10 live routes returned HTTP 200 OK on ${base} (including /protocol.html and 20/20 benchmark API)`);
          '
