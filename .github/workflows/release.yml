name: Publish verified release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: celia-publish-release
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Resolve immutable identity and release sync mode
        id: identity
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
          TAG="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - if: steps.identity.outputs.skip != 'true'
        run: npm ci --no-audit --no-fund
      # One gate per step on purpose: a combined `a && b && c` line reports "exit code 1" and nothing else,
      # which is exactly how this job failed once on main without naming the gate that broke.
      - name: Gate 1/4 · syntax of every shipped file
        if: steps.identity.outputs.skip != 'true'
        run: npm run check
      - name: Gate 2/4 · release identity and database compatibility contract
        if: steps.identity.outputs.skip != 'true'
        run: npm run release:check
      - name: Gate 3/4 · offline test suite (failing tests are named as annotations)
        if: steps.identity.outputs.skip != 'true'
        run: npm run test:ci
      - name: Gate 4/4 · dependency audit (production dependencies, no force fixes)
        if: steps.identity.outputs.skip != 'true'
        run: npm audit --omit=dev --audit-level=moderate
      - if: steps.identity.outputs.skip != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.identity.outputs.skip != 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish versioned backend image
        id: image
        if: steps.identity.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: ${{ steps.identity.outputs.image }}:${{ steps.identity.outputs.tag }}
          build-args: |
            CELIA_BUILD_SHA=${{ github.sha }}
            CELIA_VERSION=${{ steps.identity.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: Create source/site bundles, SBOM, release manifest and checksums
        if: steps.identity.outputs.skip != 'true'
        env:
          CELIA_RELEASE_IMAGE: ${{ steps.identity.outputs.image }}@${{ steps.image.outputs.digest }}
        run: npm run release:bundle && npm run release:verify
      - name: Attest release files with GitHub OIDC (no signing key in repository)
        if: steps.identity.outputs.skip != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '.release-artifacts/*'
      - name: Publish or sync verified release bundles
        if: steps.identity.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.identity.outputs.tag }}
          TAG_EXISTS: ${{ steps.identity.outputs.exists }}
        run: |
          NOTES="Verified source + static site (including /protocol Arabic architectural infographic & 20-case benchmark) + SBOM + SHA256SUMS at commit $GITHUB_SHA. The immutable backend image is recorded in release.json."
          if [ "$TAG_EXISTS" = "true" ] && gh release view "$TAG" >/dev/null 2>&1; then
            # Idempotent re-publish: when the assets already on the release are byte-identical (same SHA256SUMS),
            # nothing is uploaded and the job stays green. Re-running a green pipeline must never look like a failure.
            mkdir -p "$RUNNER_TEMP/current-release"
            CURRENT_SUMS="$(gh release download "$TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP/current-release" --clobber >/dev/null 2>&1 && cat "$RUNNER_TEMP/current-release/SHA256SUMS" || true)"
            NEW_SUMS="$(cat .release-artifacts/SHA256SUMS)"
            if [ -n "$CURRENT_SUMS" ] && [ "$CURRENT_SUMS" = "$NEW_SUMS" ]; then
              echo "::notice title=Release already current::Release $TAG already carries byte-identical assets at $GITHUB_SHA; nothing to publish (idempotent no-op)."
              exit 0
            fi
            gh release upload "$TAG" .release-artifacts/* --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "Celia $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" .release-artifacts/* \
              --target "$GITHUB_SHA" --title "Celia $TAG" \
              --notes "$NOTES"
          fi
          SUMS="$(tr '\n' ' | ' < .release-artifacts/SHA256SUMS)"
          echo "::notice title=Verified Release Synced::Release $TAG synced and OIDC-attested at commit $GITHUB_SHA ($SUMS)"
