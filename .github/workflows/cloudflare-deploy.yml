name: Deploy (Cloudflare Edge)

# CD-001 / DEC-108: never deploy to live Edge in parallel with an unfinished quality suite.
# Production deploys wait for a green `push` run of "Celia quality & resilience" on `main`
# (or an explicit `workflow_dispatch` on `main`), bind to the `production-edge` environment
# slot (reviewer lock stays an explicit owner action in Settings → Environments, REL-001),
# and refuse to overwrite `main` if a newer commit has already landed ahead of `head_sha`.

on:
  workflow_run:
    workflows: ['Celia quality & resilience']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-edge
  cancel-in-progress: false

permissions:
  contents: read
  # MAN-002: sign the exact bundle digest that was verified and uploaded.
  id-token: write
  attestations: write

jobs:
  deploy-edge:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    name: Deploy Celia Edge Worker & 18 Secrets Binding
    runs-on: ubuntu-24.04
    environment:
      name: production-edge
      url: https://celia-phone-google.celiaelazamey.workers.dev
    timeout-minutes: 10
    env:
      CELIA_EXPECT_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Refuse to overwrite main with a superseded commit
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            MAIN_HEAD="$(git rev-parse origin/main)"
            if [ "$CELIA_EXPECT_COMMIT" != "$MAIN_HEAD" ] && git merge-base --is-ancestor "$CELIA_EXPECT_COMMIT" "$MAIN_HEAD"; then
              echo "::notice title=Superseded commit::origin/main ($MAIN_HEAD) has already advanced past $CELIA_EXPECT_COMMIT; skipping stale deploy."
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "superseded=false" >> "$GITHUB_OUTPUT"
      # The integrity gate regenerates the manifest, which reads the Node tool registry and
      # therefore needs the dependency tree. pages.yml and release.yml already install; this
      # job used to skip it because it only ran the deploy script.
      - name: Install dependencies for the integrity gate
        if: steps.freshness.outputs.superseded != 'true'
        run: npm ci --no-audit --no-fund
      # MAN-002 — fail closed BEFORE any upload. release.yml attests and pages.yml verifies,
      # but this path (the one that serves users) used to upload whatever was on disk. The
      # bundle must hash to exactly what the committed manifest declares.
      - name: Verify edge bundle integrity against the committed manifest (MAN-002)
        if: steps.freshness.outputs.superseded != 'true'
        run: node scripts/verify-edge-provenance.mjs
      - name: Deploy Cloudflare Worker & bind repository secrets
        if: steps.freshness.outputs.superseded != 'true'
        env:
          AGENETROUTERAPI_KEY: ${{ secrets.AGENETROUTERAPI_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          CELIAOS_CRONJOB_ORG_API_KEY: ${{ secrets.CELIAOS_CRONJOB_ORG_API_KEY }}
          CELIA_MCP_API_TOKEN: ${{ secrets.CELIA_MCP_API_TOKEN }}
          CELIA_VOICE_ID: ${{ secrets.CELIA_VOICE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_S3_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_S3_ENDPOINT }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
          YOUR_CODATA_API_KEY: ${{ secrets.YOUR_CODATA_API_KEY }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_APP_ID: ${{ secrets.WHATSAPP_APP_ID || vars.WHATSAPP_APP_ID }}
          WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID: ${{ vars.WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID || secrets.WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          # VER-11: the deploy script binds these, but the workflow never passed them, so
          # stored credentials could never be encrypted on the edge. Wire them explicitly.
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          TOKEN_ENCRYPTION_KEY_ID: ${{ vars.TOKEN_ENCRYPTION_KEY_ID }}
          WHATSAPP_API_VERSION: ${{ vars.WHATSAPP_API_VERSION || 'v26.0' }}
          APP_OWNER_EMAIL: ${{ vars.APP_OWNER_EMAIL || secrets.APP_OWNER_EMAIL }}
          CELIA_TIMEZONE: 'Africa/Cairo'
        run: node scripts/deploy-cloudflare-edge.mjs
      # MAN-002: bind the verified bundle digest to this commit and workflow run via GitHub
      # OIDC. No signing key lives in the repository. `subject-checksums` carries the bundle
      # and manifest digests the gate computed before the upload.
      - name: Attest the deployed edge bundle (OIDC provenance)
        if: steps.freshness.outputs.superseded != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: .validation-artifacts/edge-subjects.txt
      - name: Verify live card-free Edge + D1 full runtime (MCP 12 tools + D1 durability + 401 gate)
        if: steps.freshness.outputs.superseded != 'true'
        env:
          CELIA_MCP_API_TOKEN: ${{ secrets.CELIA_MCP_API_TOKEN }}
        run: |
          node scripts/verify-live.mjs \
            --mode edge \
            --url https://celia-phone-google.celiaelazamey.workers.dev \
            --expect-commit "$CELIA_EXPECT_COMMIT" \
            --out .validation-artifacts/edge-live-acceptance.json
      # MAN-007: a green upload is not health. Only now that live acceptance passed for this
      # exact commit may the slice be marked known_good — that row is what a rollback targets.
      - name: Promote deployment slice to known_good (proof required)
        if: success() && steps.freshness.outputs.superseded != 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/promote-deployment-slice.mjs \
            --report .validation-artifacts/edge-live-acceptance.json \
            --expect-commit "$CELIA_EXPECT_COMMIT"
      - name: Upload card-free Edge live acceptance report (token-free)
        if: always() && hashFiles('.validation-artifacts/edge-live-acceptance.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edge-live-acceptance-${{ env.CELIA_EXPECT_COMMIT }}
          path: .validation-artifacts/edge-live-acceptance.json
          retention-days: 30
