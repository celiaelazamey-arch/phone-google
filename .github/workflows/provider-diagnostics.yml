name: Targeted provider diagnostics
on:
  push:
    branches: [arena/987903b1-phone-google]
    paths:
      - .github/workflows/provider-diagnostics.yml
      - scripts/provider-diagnostics.mjs
      - test/provider-diagnostics.test.js
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: targeted-provider-diagnostics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/arena/987903b1-phone-google'
    runs-on: ubuntu-24.04
    environment: integration-probes
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/provider-diagnostics.test.js test/probe-report.test.js
      - name: Diagnose two providers only (no DeepSeek or OAuth)
        id: diagnostics
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AGENTROUTER_API_KEY: ${{ secrets.AGENTROUTER_API_KEY || secrets.AGENETROUTERAPI_KEY }}
          AI_GATEWAY_MODEL: ${{ vars.AI_GATEWAY_MODEL }}
          AGENTROUTER_MODEL: ${{ vars.AGENTROUTER_MODEL }}
          CELIA_DISABLE_AI_GATEWAY: ${{ vars.CELIA_DISABLE_AI_GATEWAY }}
          CELIA_DISABLE_AGENTROUTER: ${{ vars.CELIA_DISABLE_AGENTROUTER }}
        run: node scripts/provider-diagnostics.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: targeted-provider-diagnostics-${{ github.sha }}
          path: .validation-artifacts/provider-diagnostics.json
          if-no-files-found: warn
          retention-days: 7
