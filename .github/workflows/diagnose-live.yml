name: Live URL diagnostic (temporary)

# TEMPORARY — deleted in the commit that follows its first run.
# Prints ONLY public facts (host, service names/URLs, HTTP status) as check-run annotations, so the result is
# readable without access to the job log. Never echoes a secret value. Exits 0 unless the assertions on the
# *shape* of the configuration fail (that is the signal we want).

on:
  push:
    branches: [arena/8e40050e-phone-google]
    paths:
      - '.github/workflows/diagnose-live.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Report host, visible Render services and health endpoints
        env:
          LIVE_SECRET: ${{ secrets.CELIA_LIVE_URL }}
          LIVE_VAR: ${{ vars.CELIA_LIVE_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node .github/scripts/diagnose-live.mjs
