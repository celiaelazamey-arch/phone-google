name: Celia quality & resilience

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      live_gemini:
        description: 'Optional live Gemini probe (main only; never gates offline tests)'
        type: boolean
        default: false

concurrency:
  group: celia-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} · tests & failure recovery
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Refuse tracked credentials
        run: |
          if git ls-files | grep -Ev '(^|/)\.env\.example$' | grep -Eq '(^|/)\.env($|\.)'; then
            echo '::error::A secret environment file is tracked.'
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run check && npm run release:check && npm test
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Secret-free MCP smoke test
        env:
          CELIA_MCP_DISABLE_MYSQL: 'true'
          CELIA_DISABLE_OLLAMA: 'true'
        run: npm run celia:mcp:verify
      - run: npm run build:pages

  container:
    name: Node 24 container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and verify actual container (no cloud keys)
        run: |
          docker build --file Dockerfile.mcp --build-arg CELIA_BUILD_SHA="$GITHUB_SHA" --tag celia:test .
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          docker run --detach --name celia-test --read-only --tmpfs /tmp --cap-drop ALL \
            --publish 127.0.0.1:3010:3010 \
            --env CELIA_MCP_API_TOKEN="$TOKEN" --env CELIA_MCP_DISABLE_MYSQL=true --env CELIA_DISABLE_OLLAMA=true celia:test
          trap 'docker rm --force celia-test' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3010/readyz > /tmp/ready.json; then break; fi
            sleep 1
          done
          node --input-type=module -e '
            import fs from "node:fs";
            const result = JSON.parse(fs.readFileSync("/tmp/ready.json"));
            const expected = JSON.parse(fs.readFileSync("package.json"));
            if (!result.ready || result.release.version !== expected.version || result.storage.durable) process.exit(1);
          '
          curl --fail --silent http://127.0.0.1:3010/system > /dev/null

  browser:
    name: RTL dashboard · desktop / mobile / accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Retain failure traces only
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 7

  live-gemini:
    name: Optional external Gemini availability
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.live_gemini
    runs-on: ubuntu-latest
    environment: integration-probes
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Probe only a synthetic message; never print key or generated content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          CELIA_MCP_DISABLE_MYSQL: 'true'
          CELIA_DISABLE_OLLAMA: 'true'
        run: |
          node --input-type=module -e '
            import { generateWhatsAppReply } from "./src/gemini.js";
            if (!process.env.GEMINI_API_KEY) throw new Error("Configure GEMINI_API_KEY in environment secrets");
            const reply = await generateWhatsAppReply({ config: { gemini: { apiKey: process.env.GEMINI_API_KEY, model: "gemini-2.5-flash" } }, customerMessage: "مرحبا، كيف أتواصل مع موظف؟" });
            if (!reply) process.exit(1);
            console.log("Gemini synthetic probe passed. No response content logged.");
          '
