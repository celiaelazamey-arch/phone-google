name: Celia quality & resilience

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      live_gemini:
        description: 'Optional live Gemini probe (main only; never gates offline tests)'
        type: boolean
        default: false
      live_providers:
        description: 'Optional live probe of all configured repository secrets (main only; never logs keys or content)'
        type: boolean
        default: false

concurrency:
  group: celia-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} · tests & failure recovery
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Refuse tracked credentials
        run: |
          if git ls-files | grep -Ev '(^|/)\.env\.example$' | grep -Eq '(^|/)\.env($|\.)'; then
            echo '::error::A secret environment file is tracked.'
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run check && npm run release:check && npm run check:continuity && npm test
      - name: Require handoff for implementation changes
        if: github.event_name == 'pull_request'
        env:
          CELIA_CONTINUITY_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run check:continuity
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Secret-free MCP smoke test
        env:
          CELIA_MCP_DISABLE_MYSQL: 'true'
          CELIA_DISABLE_OLLAMA: 'true'
        run: npm run celia:mcp:verify
      - name: Verify repository secrets wiring & zero-leak isolation
        if: matrix.node == '24'
        env:
          AGENETROUTERAPI_KEY: ${{ secrets.AGENETROUTERAPI_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          CELIA_MCP_API_TOKEN: ${{ secrets.CELIA_MCP_API_TOKEN }}
          CELIA_VOICE_ID: ${{ secrets.CELIA_VOICE_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUR_CODATA_API_KEY: ${{ secrets.YOUR_CODATA_API_KEY }}
        run: npm run check:secrets
      - run: npm run build:pages

  spider:
    name: Python 3.11 · Celia Google Spider tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install spider dependencies (no credentials, offline suite only)
        working-directory: celia-google-spider
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mcp>=1.9" "google-api-python-client>=2.100" "google-auth-oauthlib>=1.0" "google-auth-httplib2>=0.2" "pytest>=8"
      - name: unittest suite (includes real MCP stdio handshake, 6 tools)
        working-directory: celia-google-spider
        run: python -m unittest discover -s tests -v
      - name: pytest suite + syntax check
        working-directory: celia-google-spider
        run: |
          python -m pytest -q
          python -m compileall -q celia_spider

  container:
    name: Node 24 container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and verify actual container (no cloud keys)
        run: |
          docker build --file Dockerfile.mcp --build-arg CELIA_BUILD_SHA="$GITHUB_SHA" --tag celia:test .
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          docker run --detach --name celia-test --read-only --tmpfs /tmp --cap-drop ALL \
            --publish 127.0.0.1:3010:3010 \
            --env CELIA_MCP_API_TOKEN="$TOKEN" --env CELIA_MCP_DISABLE_MYSQL=true --env CELIA_DISABLE_OLLAMA=true celia:test
          trap 'docker rm --force celia-test' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3010/readyz > /tmp/ready.json; then break; fi
            sleep 1
          done
          node --input-type=module -e '
            import fs from "node:fs";
            const result = JSON.parse(fs.readFileSync("/tmp/ready.json"));
            const expected = JSON.parse(fs.readFileSync("package.json"));
            if (!result.ready || result.release.version !== expected.version || result.storage.durable) process.exit(1);
          '
          curl --fail --silent http://127.0.0.1:3010/system > /dev/null

  browser:
    name: RTL dashboard · desktop / mobile / accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Retain failure traces only
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 7

  mysql:
    name: MySQL 8.4 · persistence / N−1 / backup restore
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-only-password
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic-ci-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Exercise real isolated SQL, both application versions, restart and restore
        env:
          CELIA_MYSQL_TESTS: 'true'
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_PORT: ${{ job.services.mysql.ports[3306] }}
          MYSQL_TEST_CONTAINER: ${{ job.services.mysql.id }}
          MYSQL_TEST_PASSWORD: synthetic-ci-only-password
        run: npm run test:mysql
      - name: Retain sanitized acceptance evidence, never SQL dumps or credentials
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mysql-acceptance-evidence
          path: .validation-artifacts/mysql-evidence.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  live-gemini:
    name: Optional external provider availability probes
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.live_gemini || inputs.live_providers)
    runs-on: ubuntu-latest
    environment: integration-probes
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Probe synthetic requests only; never print keys or generated content
        env:
          PROBE_ALL: ${{ inputs.live_providers && 'true' || 'false' }}
          AGENETROUTERAPI_KEY: ${{ secrets.AGENETROUTERAPI_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          CELIA_MCP_API_TOKEN: ${{ secrets.CELIA_MCP_API_TOKEN }}
          CELIA_VOICE_ID: ${{ secrets.CELIA_VOICE_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          YOUR_CODATA_API_KEY: ${{ secrets.YOUR_CODATA_API_KEY }}
          CELIA_MCP_DISABLE_MYSQL: 'true'
          CELIA_DISABLE_OLLAMA: 'true'
        run: |
          node --input-type=module -e '
            import crypto from "node:crypto";
            import { loadCeliaMcpConfig } from "./src/celia-mcp.js";
            import { generateCeliaReply } from "./src/ollama.js";
            import { fetchFigmaProfile, getCodataStatus, probeCeliaVoice } from "./src/secrets-hub.js";
            const token = process.env.CELIA_MCP_API_TOKEN?.length >= 32 ? process.env.CELIA_MCP_API_TOKEN : crypto.randomBytes(32).toString("hex");
            const config = loadCeliaMcpConfig({ ...process.env, CELIA_MCP_API_TOKEN: token });
            const results = [];
            if (config.gemini.apiKey) {
              const r = await generateCeliaReply({ config, customerMessage: "مرحبا، كيف أتواصل مع موظف؟", provider: "gemini" });
              results.push({ provider: "gemini", ok: Boolean(r.reply) });
            }
            if (process.env.PROBE_ALL === "true") {
              for (const [id, key] of [["ai_gateway", config.aiGateway.apiKey], ["deepseek", config.deepseek.apiKey], ["agentrouter", config.agentrouter.apiKey]]) {
                if (!key) continue;
                const r = await generateCeliaReply({ config, customerMessage: "مرحبا، كيف أتواصل مع موظف؟", provider: id });
                results.push({ provider: id, ok: Boolean(r.reply) });
              }
              if (config.elevenlabs.apiKey && config.elevenlabs.voiceId) {
                const v = await probeCeliaVoice({ config });
                results.push({ provider: "elevenlabs", ok: Boolean(v.reachable) });
              }
              if (config.figma.accessToken) {
                const f = await fetchFigmaProfile({ config });
                results.push({ provider: "figma", ok: Boolean(f.id) });
              }
              if (config.codata.apiKey) {
                const c = await getCodataStatus({ config, probe: Boolean(config.codata.baseUrl) });
                results.push({ provider: "codata", configured: c.configured, probed: Boolean(config.codata.baseUrl) });
              }
            }
            if (!results.length) throw new Error("No requested provider secrets configured in environment");
            console.log(JSON.stringify({ syntheticProbes: results, responseContentLogged: false }, null, 2));
          '
