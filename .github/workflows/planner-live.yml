name: Planner live run (isolated)

# WP-3.1 / DEC-060. Proves the provider planner against the REAL Gemini endpoint with the repository secret,
# inside a throwaway SQLite store, with read-only tools and hard bounds. It is deliberately not a deployment:
# no MySQL, no migration, no outbox effect, no production flag is changed by this workflow.
#
# Trigger: manual (Actions → "Planner live run (isolated)" → Run workflow) or a push whose commit message contains
# "[planner-live]". The report contains counts, latencies and token totals only — never the key, a prompt body or a
# raw provider response; `scripts/planner-live.mjs` sanitizes and then scans its own output for every secret value.
# The probe allows 45s per decision (the provider default stays 20s) because the first live run, 40936215392 on
# 4c6fe35, timed out twice at 20s; the wider bound separates "slow" from "broken" and the report records the bound used.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Gemini model id for the planner"
        type: string
        default: "gemini-2.5-flash"
      max_runs:
        description: "How many of the fixed scenarios to run (1..3)"
        type: string
        default: "3"
      timeout_ms:
        description: "Per-decision provider timeout in ms (20s is the provider default; the probe allows 45s)"
        type: string
        default: "45000"
      scenarios:
        description: "Optional comma list: live-1,live-2,live-3 (empty = all three; one scenario is the cheap run)"
        type: string
        default: ""
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: planner-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[planner-live]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Live planner run (isolated SQLite, read-only tools, no external effect)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model || 'gemini-2.5-flash' }}
          CELIA_AGENT_PLANNER: provider
          CELIA_AGENT_RUNTIME: sqlite
          CELIA_KB: "off"
          CELIA_DISABLE_OLLAMA: "true"
          CELIA_AGENT_PLANNER_TIMEOUT_MS: ${{ inputs.timeout_ms || '45000' }}
          PLANNER_LIVE_WALL_MS: "300000"
          # Live run 40937158612 got HTTP 429 twice in a row on the free tier; the probe spaces its calls instead of
          # retrying (DEC-059 refuses retries), and the report records the spacing it used.
          PLANNER_LIVE_PACE_MS: "12000"
          PLANNER_LIVE_RETRY_MS: "20000"
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error title=Planner live::GEMINI_API_KEY is not configured for this repository"
            exit 2
          fi
          if [ -n "${{ inputs.scenarios }}" ]; then
            node scripts/planner-live.mjs --model "$GEMINI_MODEL" --max-runs "${{ inputs.max_runs || '3' }}" --only "${{ inputs.scenarios }}"
          else
            node scripts/planner-live.mjs --model "$GEMINI_MODEL" --max-runs "${{ inputs.max_runs || '3' }}"
          fi
      - name: Upload sanitized live report
        if: always() && hashFiles('.validation-artifacts/planner-live.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: planner-live-${{ github.sha }}
          path: |
            .validation-artifacts/planner-live.json
            .validation-artifacts/planner-live-summary.md
          include-hidden-files: true
          retention-days: 90
